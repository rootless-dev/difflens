  <path fill="#052e35" d="M628 100 c103.61 0 155.41 0 194.99 20.16 a185 185 0 0 1 80.85 80.85 c20.16 39.57 20.16 91.38 20.16 194.99 V628 c0 103.61 0 155.41 -20.16 194.99 a185 185 0 0 1 -80.85 80.85 c-39.57 20.16 -91.38 20.16 -194.99 20.16 H396 c-103.61 0 -155.41 0 -194.99 -20.16 a185 185 0 0 1 -80.85 -80.85 c-20.16 -39.57 -20.16 -91.38 -20.16 -194.99 V396 c0 -103.61 0 -155.41 20.16 -194.99 a185 185 0 0 1 80.85 -80.85 c39.57 -20.16 91.38 -20.16 194.99 -20.16 Z"/>

