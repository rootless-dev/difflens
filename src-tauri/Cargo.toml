[package]
name = "difflens"
version = "0.1.0"
description = "Desktop app for reviewing AI-generated code"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "difflens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
# Reads the `git archive` stream of a commit into a source tree for analyzers.
tar = { version = "0.4", default-features = false }
# Fingerprints reviewed content (`fingerprint`); already built for Tauri.
sha2 = "0.11"
# Talks to pull request hosts (`pull_requests::http`). Already built for
# Tauri without TLS; the blocking client fits the commands' blocking threads,
# and native TLS uses the system's certificates through Security.framework.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Keeps pull request host tokens in the macOS Keychain, never in the database.
keyring = { version = "3", features = ["apple-native"] }
# Opens a pull request in the system browser.
tauri-plugin-opener = "2"
# The pseudo-terminals of the embedded terminal (`terminals`): the one wezterm
# uses, maintained with it, and it exposes the terminal's foreground process
# group, which closing a busy session needs.
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
# Stops a timed-out fetch or analyzer together with the processes it started,
# and a terminal session's process groups.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
